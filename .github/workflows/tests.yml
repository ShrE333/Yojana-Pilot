name: Offline tests

on:
  push:
    branches: [main, refactor]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip check
      - run: python -m pytest -q
