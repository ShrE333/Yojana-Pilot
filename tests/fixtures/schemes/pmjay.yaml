# Ayushman Bharat PM-JAY (health cover up to Rs 5 lakh per family per year)
# Two routes: family listed in SECC 2011 / state-added lists, OR any person aged 70+ (Vay Vandana card).
# Whether a family is in the list can only be checked on beneficiary.nha.gov.in, so the bot
# asks the user to check rather than deciding it.

id: pmjay
name: Ayushman Bharat PM-JAY
name_hi: आयुष्मान भारत प्रधानमंत्री जन आरोग्य योजना
name_mr: आयुष्मान भारत प्रधानमंत्री जन आरोग्य योजना
source_url: https://nha.gov.in/PM-JAY
other_sources:
  - https://beneficiary.nha.gov.in/
last_verified: 2026-10-21
benefit_summary: "Free hospital treatment up to Rs 5 lakh per family per year at empanelled hospitals"
benefit_annual_inr: 0      # cover, not cash; ranking uses value_score instead

rank:
  value_score: 5
  effort: 1

eligibility:
  any:
    - field: age
      op: gte
      value: 70
      near_miss: 2
      reason: "Everyone aged 70+ is covered irrespective of income (Ayushman Vay Vandana card)"
    - field: in_pmjay_beneficiary_list
      op: eq
      value: true
      reason: "Family appears in the PM-JAY beneficiary list (SECC 2011 or state-added)"

dependencies:
  - id: ayushman_card_made
    label: "Ayushman card generated"
    fix: make_card

documents:
  - {name: "Aadhaar card", issued_by: "UIDAI / Aadhaar Seva Kendra", key: aadhaar}
  - {name: "Ration card", issued_by: "Tehsil / supply office", key: ration_card}

records_to_match:
  - [aadhaar, ration_card]

actions:
  make_card:
    text: "Make your Ayushman card with Aadhaar e-KYC on the Ayushman app or at a CSC / empanelled hospital"
    where: "beneficiary.nha.gov.in, Ayushman app, CSC or empanelled hospital"
  check_list:
    text: "Check whether your family is in the list on beneficiary.nha.gov.in using your mobile number or ration card"
    where: "beneficiary.nha.gov.in or helpline 14555 (verify)"
  fix_name_mismatch:
    text: "Make the name the same on Aadhaar and the ration card"
    where: "Aadhaar Seva Kendra or tehsil supply office"
  file_grievance:
    text: "Raise a grievance with the State Health Agency"
    where: "cgrms.pmjay.gov.in or helpline 14555 (verify)"

status_map:
  "not found":
    - {action: check_list, weight: 0.6}
    - {action: fix_name_mismatch, weight: 0.4, boost_if: name_mismatch}
  "ekyc failed":
    - {action: fix_name_mismatch, weight: 0.6, boost_if: name_mismatch}
    - {action: make_card, weight: 0.4}
  "rejected":
    - {action: fix_name_mismatch, weight: 0.5, boost_if: name_mismatch}
    - {action: file_grievance, weight: 0.5}
